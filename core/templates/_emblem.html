{% macro emblem(key, size_class=none) %}
<svg class="co-emblem{% if size_class %} {{ size_class }}{% endif %}" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
{% if key == 'zodiak' %}
  <circle class="em-line" cx="32" cy="32" r="29" />
  <circle class="em-line" cx="32" cy="32" r="19" />
  {% for spoke in range(12) %}
  <line class="em-line" x1="32" y1="3" x2="32" y2="13" transform="rotate({{ spoke * 30 }} 32 32)" />
  {% endfor %}
  <path class="em-fill" d="M32 18 L35 29 L46 32 L35 35 L32 46 L29 35 L18 32 L29 29 Z" />
{% elif key == 'shio' %}
  <rect class="em-seal" x="7" y="7" width="50" height="50" rx="3" transform="rotate(-3 32 32)" />
  <rect class="em-paper" x="12" y="12" width="40" height="40" rx="1" transform="rotate(-3 32 32)" />
  <text class="em-hanzi" x="32" y="33" transform="rotate(-3 32 32)">命</text>
{% elif key == 'weton' %}
  <path class="em-fill" d="M32 2 L38.4 8.4 L46 18.6 L53.8 31.4 L58.9 44.2 L61.4 55.8 L57.6 62 L6.4 62 L2.6 55.8 L5.1 44.2 L10.2 31.4 L18 18.6 L25.6 8.4 Z" />
  <path class="em-ink" d="M32 58 L32 16 M32 30 L22 22 M32 30 L42 22 M32 40 L19 32 M32 40 L45 32 M32 50 L16 44 M32 50 L48 44" />
{% else %}
  <rect class="em-back" x="10" y="12" width="26" height="40" rx="2.5" transform="rotate(-12 23 32)" />
  <rect class="em-back" x="28" y="12" width="26" height="40" rx="2.5" transform="rotate(10 41 32)" />
  <rect class="em-line" x="32" y="17" width="18" height="30" rx="1" transform="rotate(10 41 32)" />
  <path class="em-fill" d="M41 23 L43 30 L48 32 L43 34 L41 41 L39 34 L34 32 L39 30 Z" transform="rotate(10 41 32)" />
{% endif %}
</svg>
{% endmacro %}
