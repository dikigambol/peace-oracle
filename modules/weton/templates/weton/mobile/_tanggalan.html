{% import 'weton/_komponen.html' as komponen with context %}
<div class="wt-m-shell wt-m-shell-fab" data-bottom-nav>
  {{ komponen.mobile_appbar("Kalender Jawa", "m-cal-share", "Bagikan hari terpilih", False) }}

  <main class="wt-m-main">
    <div class="wt-m-cal-month">
      <button class="wt-m-icon" id="m-cal-prev" type="button" aria-label="Bulan sebelumnya">
        <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
      </button>
      <div class="wt-m-cal-heading">
        <h2 class="wt-m-cal-title" id="m-cal-month"></h2>
        <p class="wt-result-sub" id="m-cal-jawa"></p>
      </div>
      <button class="wt-m-icon" id="m-cal-next" type="button" aria-label="Bulan berikutnya">
        <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
      </button>
    </div>

    <div class="wt-m-strip" id="m-cal-strip" role="listbox" aria-label="Pilih tanggal"></div>
    <p class="wt-error" id="m-cal-error" role="alert" hidden></p>

    <div id="m-cal-detail" aria-live="polite"></div>

    <details class="wt-card wt-m-wetonan">
      <summary>Tandai wetonanmu</summary>
      <p class="wt-hint">Hari dengan weton yang sama dengan weton lahirmu akan ditandai di strip tanggal.</p>
      <label class="wt-field" for="m-lahir-tanggal">
        <span class="wt-label">Tanggal lahir</span>
        <input class="wt-input wt-input-lg" id="m-lahir-tanggal" type="date" min="{{ first_date }}" max="{{ last_date }}" />
      </label>
      <label class="wt-field" for="m-lahir-jam">
        <span class="wt-label">Jam lahir <em class="wt-optional">opsional</em></span>
        <input class="wt-input wt-input-lg" id="m-lahir-jam" type="time" />
      </label>
      <label class="wt-field" for="m-lahir-kota">
        <span class="wt-label">Kota lahir <em class="wt-optional">opsional</em></span>
        <input class="wt-input wt-input-lg" id="m-lahir-kota" list="wt-city-options" placeholder="Default: Jakarta" autocomplete="off" />
      </label>
      <div class="wt-m-result-actions">
        <button class="wt-btn wt-btn-ghost" id="m-wetonan-clear" type="button">Hapus tanda</button>
        <button class="wt-btn wt-btn-primary" id="m-wetonan-submit" type="button">Tandai</button>
      </div>
      <div id="m-wetonan-summary" hidden></div>
    </details>

    <p class="wt-note" id="m-cal-note"></p>
    <p class="wt-sources" id="m-cal-disclaimer"></p>
  </main>

  <button class="wt-btn wt-btn-primary wt-m-fab" id="m-cal-today" type="button">
    <i class="fa-solid fa-calendar-day" aria-hidden="true"></i> Hari ini
  </button>

  {{ komponen.mobile_tabbar("kalender") }}
</div>
