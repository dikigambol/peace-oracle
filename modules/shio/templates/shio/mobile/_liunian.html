<div class="sh-m-shell" data-bottom-nav>
  {{ appbar("Liu Nian") }}

  <main class="sh-m-main">
    <section class="sh-m-steps" id="m-yearly-steps">
      {{ progress("yearly", 2) }}

      <div class="sh-m-step" data-step="1">
        <h2 class="sh-m-question">Shio kamu apa?</h2>
        <p class="sh-m-help">Pilih shio sesuai tahun Imlek kelahiranmu.</p>
        {{ shio_picker('sh-m-shio-picker') }}
      </div>

      <div class="sh-m-step" data-step="2" hidden>
        <h2 class="sh-m-question">Tahun berapa?</h2>
        <p class="sh-m-help">Geser ke tahun yang ingin kamu teropong.</p>
        {{ year_picker("m") }}
      </div>

      <p class="sh-error" id="m-yearly-error" role="alert" hidden></p>
      {{ actions("yearly") }}
    </section>

    <section class="sh-result" id="m-yearly-result" hidden aria-live="polite">
      <div class="sh-m-chip" id="m-yearly-chip"></div>
      <div id="m-yearly-summary"></div>
      <div class="sh-m-segment" role="tablist" aria-label="Kategori proyeksi" id="m-yearly-segment"></div>
      <div id="m-yearly-panel" role="tabpanel"></div>
      <div class="sh-m-result-actions">
        <button class="sh-btn sh-btn-ghost" type="button" id="m-yearly-reset">Ganti pilihan</button>
      </div>
    </section>
  </main>

  {{ mobile_tabbar('liunian') }}
</div>
