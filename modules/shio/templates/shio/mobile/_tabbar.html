{% import 'shio/_caidan.html' as caidan %}
<nav class="sh-m-tabbar" aria-label="Fitur Shio">
  <a class="sh-m-tab{% if active == 'index' %} is-active{% endif %}" href="{{ url_for('shio.shio_index') }}"{% if active == 'index' %} aria-current="page"{% endif %}>
    <i class="fa-solid fa-yin-yang" aria-hidden="true"></i><span>Beranda</span>
  </a>
  {% for feature in caidan.features if feature.key in caidan.tabbar_main %}
  <a class="sh-m-tab{% if active == feature.key %} is-active{% endif %}" href="{{ url_for(feature.endpoint) }}"{% if active == feature.key %} aria-current="page"{% endif %}>
    <i class="fa-solid {{ feature.icon }}" aria-hidden="true"></i><span>{{ feature.short }}</span>
  </a>
  {% endfor %}
  <button class="sh-m-tab{% if active in caidan.tabbar_more %} is-active{% endif %}" type="button" data-sheet-open aria-expanded="false" aria-controls="m-more-sheet">
    <i class="fa-solid fa-ellipsis" aria-hidden="true"></i><span>Lainnya</span>
  </button>
</nav>
<div class="sh-m-sheet" id="m-more-sheet" data-sheet hidden>
  <div class="sh-m-sheet-backdrop" data-sheet-close></div>
  <div class="sh-m-sheet-panel" role="dialog" aria-label="Fitur lainnya">
    <p class="sh-m-sheet-title">Fitur lainnya</p>
    {% for feature in caidan.features if feature.key in caidan.tabbar_more %}
    <a class="sh-m-sheet-link{% if active == feature.key %} is-active{% endif %}" href="{{ url_for(feature.endpoint) }}"{% if active == feature.key %} aria-current="page"{% endif %}>
      <i class="fa-solid {{ feature.icon }}" aria-hidden="true"></i>
      <span>{{ feature.title }}</span>
    </a>
    {% endfor %}
    <button class="sh-btn sh-btn-ghost sh-btn-block" type="button" data-sheet-close>Tutup</button>
  </div>
</div>
