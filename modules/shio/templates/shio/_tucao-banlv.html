{% import 'shio/_caidan.html' as caidan %}
<div class="roast-pair">
  <button type="button" class="roast-pair-cta" data-pair-toggle aria-expanded="false">
    <i class="fa-solid fa-user-group" aria-hidden="true"></i>
    <span>Bakar Bareng Pasangan</span>
  </button>
  <div class="roast-pair-body" data-pair-body hidden>
    <p class="roast-pair-note">
      Pilih shio orang kedua. Roasting hubungan diambil dari relasi cabang tahun kalian &mdash; bukan dari pasangan shio satu per satu.
    </p>
    <div class="roast-pair-grid" role="group" aria-label="Shio pasangan">
      {% for key, hanzi, name in caidan.shio_list %}
      <button type="button" class="pair-pick" data-shio="{{ key }}" aria-pressed="false">
        <span class="pair-pick-hanzi">{{ hanzi }}</span><span class="pair-pick-name">{{ name }}</span>
      </button>
      {% endfor %}
    </div>
    <p class="sh-loading sh-roast-pair-loading" data-pair-loading hidden>
      <i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i> Menyalakan api berdua...
    </p>
    <div class="roast-pair-card" data-pair-card hidden></div>
  </div>
</div>
